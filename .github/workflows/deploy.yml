# CD: imagem multi-arquitetura no GHCR → deploy na VM (Oracle Cloud) via SSH → smoke test.
# O deploy só roda quando a variável de repositório DEPLOY_ENABLED = "true" (VM pronta).
# Secrets: OCI_VM_HOST, OCI_VM_USER, OCI_VM_SSH_KEY. Passo a passo: docs/DEPLOY.md
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false # nunca interrompe um deploy no meio

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: Build multi-arch e push no GHCR
    runs-on: ubuntu-24.04
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - id: meta
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}/aggregator" >> "$GITHUB_OUTPUT"

      # Oracle Always Free Ampere A1 é ARM: a imagem sai para amd64 E arm64.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: aggregator
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ github.sha }}
            ${{ steps.meta.outputs.image }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy na VM (Oracle Cloud)
    needs: image
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    environment: production
    env:
      VM: ${{ secrets.OCI_VM_USER }}@${{ secrets.OCI_VM_HOST }}
    steps:
      - uses: actions/checkout@v4

      - name: Configura SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.OCI_VM_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "${{ secrets.OCI_VM_HOST }}" >> ~/.ssh/known_hosts

      - name: Envia os arquivos da stack (compose, mocks, observabilidade, flags, scripts)
        run: |
          rsync -az --delete -e "ssh -i ~/.ssh/id_deploy" \
            --include='docker-compose.yml' --include='docker-compose.chaos.yml' \
            --include='mocks/***' --include='observability/***' --include='deploy/***' \
            --exclude='flags/' --exclude='*' \
            ./ "$VM:/opt/agregador-voos/"
          # flags/: só na 1ª vez (depois é editado na VM como kill switch, sem deploy)
          ssh -i ~/.ssh/id_deploy "$VM" 'test -f /opt/agregador-voos/flags/flags.json' \
            || rsync -az -e "ssh -i ~/.ssh/id_deploy" flags "$VM:/opt/agregador-voos/"

      - name: Atualiza a stack na VM
        run: |
          ssh -i ~/.ssh/id_deploy "$VM" \
            "GHCR_USER='${{ github.actor }}' GHCR_TOKEN='${{ secrets.GITHUB_TOKEN }}' \
             IMAGE='${{ needs.image.outputs.image }}:${{ github.sha }}' VERSION='${{ github.sha }}' \
             bash /opt/agregador-voos/deploy/deploy.sh"

      - name: Smoke test pelo IP público
        run: bash deploy/smoke-test.sh "http://${{ secrets.OCI_VM_HOST }}:8000" "${{ github.sha }}"
