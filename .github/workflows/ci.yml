# CI: qualidade + testes (unit e integração com Redis/Postgres reais via Testcontainers)
# + build da imagem + smoke test da stack inteira com docker compose.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, typecheck, testes e cobertura
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: aggregator
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # commitlint precisa do histórico do PR

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: aggregator/package-lock.json

      - run: npm ci

      - name: Conventional Commits (PR)
        if: github.event_name == 'pull_request'
        run: >
          npx commitlint
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}

      - name: Lint (eslint + prettier)
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Testes + cobertura (Testcontainers usa o Docker do runner)
        run: npm run coverage

      - name: Relatório de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: aggregator/coverage/
          retention-days: 14

      - run: npm run build

  stack:
    name: Imagem + smoke test da stack (docker compose)
    needs: quality
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build da imagem do agregador (com cache do GitHub Actions)
        uses: docker/build-push-action@v6
        with:
          context: aggregator
          load: true
          tags: agregador-voos-aggregator:local
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Sobe a stack (providers + redis + postgres + agregador)
        run: docker compose up -d --wait --wait-timeout 180

      - name: Smoke test
        run: bash scripts/smoke-test.sh http://localhost:8000

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: aggregator/package-lock.json

      - name: Testes E2E contra a stack (mocks reais)
        working-directory: aggregator
        run: npm ci && npm run test:e2e

      - name: Logs em caso de falha
        if: failure()
        run: docker compose logs --no-color --tail 200

      - name: Derruba a stack
        if: always()
        run: docker compose down -v
