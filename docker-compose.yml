name: agregador-voos

# `build.network: host` nos dois builds: em host com systemd-resolved (ou com
# resolver de VPN), o container de build não resolve DNS pela bridge e o
# download de dependências falha. Usando a rede do host o build baixa normal.
# Em máquina com DNS de bridge funcionando a linha é inócua — pode remover.

services:
  # ---------------------------------------------------------------- providers
  # Sistemas de terceiros simulados. Mesma imagem, contratos diferentes.
  provider-a:
    build:
      context: ./mocks
      network: host
    image: agregador-voos-mocks
    environment:
      PROVIDER: a
    ports:
      - "3001:3000"

  provider-b:
    build:
      context: ./mocks
      network: host
    image: agregador-voos-mocks
    environment:
      PROVIDER: b
    ports:
      - "3002:3000"

  provider-c:
    build:
      context: ./mocks
      network: host
    image: agregador-voos-mocks
    environment:
      PROVIDER: c
      # Chaos engineering: descomente para ver a degradação parcial em ação.
      # (ou use `make chaos` / `make calm`, que aplicam docker-compose.chaos.yml)
      # FAIL_RATE: "0.3"      # 30% das chamadas devolvem 500
      # TIMEOUT_RATE: "0.3"   # 30% estouram o timeout de 3s
    ports:
      - "3003:3000"

  # ---------------------------------------------------------------- agregador
  # A API desenvolvida no desafio. Dentro da rede do compose os providers são acessados
  # pelo NOME DO SERVIÇO e pela porta interna 3000 (não localhost:3001-3003).
  aggregator:
    build:
      context: ./aggregator
      network: host
    image: ${AGGREGATOR_IMAGE:-agregador-voos-aggregator:local}
    environment:
      NODE_ENV: production
      PORT: "8000"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      APP_VERSION: ${APP_VERSION:-local}
      PROVIDER_A_URL: http://provider-a:3000/provider-a/search
      PROVIDER_B_URL: http://provider-b:3000/provider-b/search
      PROVIDER_C_URL: http://provider-c:3000/provider-c/search
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgres://aggregator:${POSTGRES_PASSWORD:-aggregator}@postgres:5432/aggregator
      # Vazio = tracing desligado; `make obs` aponta para o Jaeger.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      SHUTDOWN_GRACE_MS: "2000"
      # Feature flags (OpenFeature, arquivo com recarga a quente): edite flags/flags.json e a
      # mudança vale em ~2 s, sem restart nem deploy (ex.: kill switch de provider).
      FLAGS_FILE: /app/flags/flags.json
    volumes:
      - ./flags:/app/flags:ro
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      provider-a:
        condition: service_started
      provider-b:
        condition: service_started
      provider-c:
        condition: service_started
    stop_grace_period: 15s
    restart: unless-stopped

  # ----------------------------------------------------------- infraestrutura
  # Redis como CACHE puro: sem persistência em disco (perder o cache num restart é
  # aceitável: ele se reconstrói em 5 min) e com teto de memória + LRU, para nunca
  # crescer sem limite. Porta só em 127.0.0.1: acessível para dev local, nunca
  # exposta na interface pública da VM.
  redis:
    image: redis:7.4-alpine
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - 128mb
      - --maxmemory-policy
      - allkeys-lru
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 2s
      retries: 10

  # Postgres: persistência ANALÍTICA das buscas (alimenta o dashboard de insights).
  # O agregador aplica as migrations no boot; o Grafana lê com um papel somente leitura
  # (observability/postgres/init). Porta só em 127.0.0.1.
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: aggregator
      POSTGRES_USER: aggregator
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aggregator}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./observability/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aggregator -d aggregator"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ------------------------------------------------- observabilidade (profile)
  # Fora do `make up` padrão para manter a stack leve; suba com `make obs`.
  jaeger:
    profiles: ["observability"]
    image: jaegertracing/all-in-one:1.62.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"            # UI
      - "127.0.0.1:4318:4318"    # OTLP/HTTP (só local)

  prometheus:
    profiles: ["observability"]
    image: prom/prometheus:v3.1.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  grafana:
    profiles: ["observability"]
    image: grafana/grafana:11.4.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      # Leitura anônima do dashboard (demo); edição só com login.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/aggregator.json
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      postgres:
        condition: service_healthy
      prometheus:
        condition: service_started
    ports:
      - "3000:3000"

volumes:
  pgdata:
