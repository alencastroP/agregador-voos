name: agregador-voos

# `build.network: host` nos dois builds: em host com systemd-resolved (ou com
# resolver de VPN), o container de build não resolve DNS pela bridge e o
# download de dependências falha. Usando a rede do host o build baixa normal.
# Em máquina com DNS de bridge funcionando a linha é inócua — pode remover.

services:
  # ---------------------------------------------------------------- providers
  # Sistemas de terceiros simulados. Mesma imagem, contratos diferentes.
  provider-a:
    build:
      context: ./mocks
      network: host
    image: agregador-voos-mocks
    environment:
      PROVIDER: a
    ports:
      - "3001:3000"

  provider-b:
    build:
      context: ./mocks
      network: host
    image: agregador-voos-mocks
    environment:
      PROVIDER: b
    ports:
      - "3002:3000"

  provider-c:
    build:
      context: ./mocks
      network: host
    image: agregador-voos-mocks
    environment:
      PROVIDER: c
      # Chaos engineering: descomente para ver a degradação parcial em ação.
      # (ou use `make chaos` / `make calm`, que aplicam docker-compose.chaos.yml)
      # FAIL_RATE: "0.3"      # 30% das chamadas devolvem 500
      # TIMEOUT_RATE: "0.3"   # 30% estouram o timeout de 3s
    ports:
      - "3003:3000"

  # ----------------------------------------------------------- infraestrutura
  # Redis como CACHE puro: sem persistência em disco (perder o cache num restart é
  # aceitável: ele se reconstrói em 5 min) e com teto de memória + LRU, para nunca
  # crescer sem limite. Porta só em 127.0.0.1: acessível para dev local, nunca
  # exposta na interface pública da VM.
  redis:
    image: redis:7.4-alpine
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - 128mb
      - --maxmemory-policy
      - allkeys-lru
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 2s
      retries: 10

  # ------------------------------------------------- observabilidade (profile)
  # Fora do `make up` padrão para manter a stack leve; suba com `make obs`.
  jaeger:
    profiles: ["observability"]
    image: jaegertracing/all-in-one:1.62.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"            # UI
      - "127.0.0.1:4318:4318"    # OTLP/HTTP (só local)

  prometheus:
    profiles: ["observability"]
    image: prom/prometheus:v3.1.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "9090:9090"
