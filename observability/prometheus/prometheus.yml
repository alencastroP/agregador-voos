# Prometheus do profile `observability` (make obs).
# Raspa o /metrics do agregador a cada 5 s dentro da rede do compose.
# (Um único alvo: um segundo apontando para a porta publicada no host contaria o MESMO
# processo duas vezes e dobraria os contadores nos painéis.)
global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: flight-aggregator
    metrics_path: /metrics
    static_configs:
      - targets: ["aggregator:8000"]
