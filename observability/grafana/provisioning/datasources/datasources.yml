# Datasources provisionadas (versionadas): o dashboard referencia pelos UIDs fixos.
apiVersion: 1
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      timeInterval: 5s

  - name: Postgres (insights)
    uid: postgres
    type: grafana-postgresql-datasource
    access: proxy
    url: postgres:5432
    user: grafana_ro
    jsonData:
      database: aggregator
      sslmode: disable
      postgresVersion: 1700
      timescaledb: false
    secureJsonData:
      password: grafana_ro
